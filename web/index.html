<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Polar Browser</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui;background:#040611;color:#dce8f8}*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-rows:auto 1fr}.bar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding:10px;background:#0a0d1e;border-bottom:1px solid #20263b}button,input{font:inherit}input{min-width:0;padding:9px 12px;border:1px solid #27314e;border-radius:7px;color:inherit;background:#03050d}button{padding:8px 12px;border:1px solid #29334e;border-radius:7px;color:#9eeeff;background:#11162a}.stage{display:grid;place-items:center;padding:14px}.empty{text-align:center;color:#73809a}.empty b{display:block;margin-bottom:8px;color:#e9f4ff}
</style></head><body><form class="bar" id="nav"><span>◎</span><input id="url" aria-label="Address" placeholder="https://example.com"><button>Request navigation</button></form><main class="stage"><div class="empty"><b>Brokered browser surface</b>The plugin requests navigation; the host selects Obscura, Chrome DevTools, or another qualified backend.</div></main><script type="module">
import {navigationRequest,PLUGIN_ID} from './protocol.js';const form=document.querySelector('#nav');const input=document.querySelector('#url');let context=null;parent.postMessage({schema_version:'polar.ui-ready/v1',plugin_id:PLUGIN_ID},'*');addEventListener('message',event=>{if(event.data?.schema_version==='polar.ui-context/v1'&&event.data.plugin_id===PLUGIN_ID)context=event.data.context});form.addEventListener('submit',event=>{event.preventDefault();try{parent.postMessage(navigationRequest(input.value,context),'*')}catch(error){parent.postMessage({schema_version:'polar.ui-error/v1',plugin_id:PLUGIN_ID,message:error.message},'*')}});
</script></body></html>
