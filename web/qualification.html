<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Polar Browser qualification</title><style>body{background:#040611;color:#dce8f8;font:16px system-ui;padding:24px}output{color:#75e6ff}</style></head><body><h1>Browser RPC qualification</h1><output aria-live="polite">Waiting for host binding…</output><script type="module">
import{navigationRequest,PLUGIN_ID}from'./protocol.js';const output=document.querySelector('output');let timer,pending='';parent.postMessage({schema_version:'polar.ui-ready/v1',plugin_id:PLUGIN_ID},'*');addEventListener('message',event=>{const data=event.data;if(data?.plugin_id!==PLUGIN_ID)return;if(data.schema_version==='polar.ui-context/v1'){clearTimeout(timer);timer=setTimeout(()=>{try{const request=navigationRequest(data.context.initialPreviewUrl??'',data.context);pending=request.request_id;output.textContent=`Request sent: ${pending.slice(0,8)}`;parent.postMessage(request,'*')}catch(error){output.textContent=`FAIL: ${error.message}`}},100);return}if(data.schema_version==='polar.ui-response/v1'&&data.request_id===pending)output.textContent=`${data.status}: ${data.output?.admitted_url??data.error??'no receipt'}`});
</script></body></html>
